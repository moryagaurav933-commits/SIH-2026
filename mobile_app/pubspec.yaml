name: krishi_saarthi
description: "कृषि-सारथी: Offline-First Agricultural Intelligence OS for Indian Farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Pinned to match mobile_app/pubspec.lock exactly.
  # Dart 3.13.x / Flutter 3.47.x are the versions this project was
  # resolved and verified against. Do not loosen this.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.5
  lottie: ^3.5.1

  # Camera & Media
  camera: ^0.11.4
  image_picker: ^1.2.3
  video_player: ^2.14.0

  # ML & AI
  # tflite_flutter: ^0.11.0  # Uncomment when ready
  # onnxruntime: ^1.0.0      # Uncomment when ready

  # Location & Maps
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  google_maps_flutter: ^2.18.0

  # Nearby Connections (Mesh)
  # nearby_connections: ^4.1.0  # Uncomment when ready

  # QR Code
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Storage
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.11.1
  connectivity_plus: ^6.1.5
  http: ^1.6.0

  # State Management
  provider: ^6.1.5+1

  # Sensors
  sensors_plus: ^6.1.2

  # AR & ARCore
  # ar_flutter_plugin: ^0.7.4  # Uncomment when ready

  # Crypto
  encrypt: ^5.0.3
  crypto: ^3.0.7

  # Utils
  intl: ^0.20.3
  uuid: ^4.6.0
  path: ^1.9.0
  permission_handler: ^11.4.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  camera_macos: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.8.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
